[project]
name = "ai-observability-langfuse-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK observed with Langfuse only: traces, prompts, scores, datasets."
requires-python = ">=3.11"
# Deliberately no openlit / traceloop-sdk / opentelemetry-instrumentation-*.
# Agent spans come from the Agents SDK's own tracing interface, bridged to
# Langfuse in src/langfuse_tracing.py. `langfuse` is the only observability dep.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "httpx>=0.27",
  "openai-agents>=0.17.5",
  "langfuse>=4,<5",
]
