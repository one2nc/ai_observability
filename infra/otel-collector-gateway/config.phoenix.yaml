receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Self-monitoring
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-gateway
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  batch:
    send_batch_size: 500
    timeout: 5s

exporters:
  # Phoenix's OTLP HTTP trace collector is /v1/traces; the exporter appends
  # that signal path to this base endpoint.
  otlphttp/phoenix:
    endpoint: ${env:PHOENIX_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:PHOENIX_ADMIN_SECRET}"
    tls:
      insecure: true

  # Phoenix is a trace analysis UI, not this repo's metrics dashboard sink.
  # Keep OTLP metrics exposed for Prometheus-compatible scraping on :8889.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 30m
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus]
    # Phoenix does not provide a general log ingestion store for this setup.
    # Use SINK=grafana or SINK=signoz when log querying is part of the experiment.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
